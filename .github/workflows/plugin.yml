# Build and test the native plugin (plugin/) on Linux, macOS and Windows.
# Artefacts: VST3 + CLAP + Standalone everywhere, AU on macOS, LV2 on Linux.
# The editor embeds the web app (built here with npm) in the system web view:
# WebKitGTK on Linux, WKWebView on macOS, WebView2 on Windows (SDK fetched by CMake).
name: Plugin

on:
  push:
    paths: ['plugin/**', 'src/**', 'index.html', 'package*.json', 'vite.config.ts', 'tests/golden.test.ts', '.github/workflows/plugin.yml']
  pull_request:
    paths: ['plugin/**', 'src/**', 'index.html', 'package*.json', 'vite.config.ts', 'tests/golden.test.ts', '.github/workflows/plugin.yml']
  workflow_dispatch:

concurrency:
  group: plugin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The TS core must still produce the golden numbers the C++ port is tested against.
  golden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx vitest run tests/golden.test.ts

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, name: linux }
          - { os: macos-15, name: macos }
          - { os: windows-2025, name: windows }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build xvfb \
            libasound2-dev libjack-jackd2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev \
            libxrandr-dev libxrender-dev libxi-dev libwebkit2gtk-4.1-dev

      - name: Configure
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then GEN="-G Ninja -DCMAKE_BUILD_TYPE=Release"; fi
          if [ "$RUNNER_OS" = "macOS" ]; then GEN="-G Xcode -DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"; fi
          cmake -S plugin -B build $GEN

      # Linux: the LV2 manifest step loads the plugin, which (with WebKitGTK) needs a display.
      - name: Build
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a cmake --build build --config Release --parallel 4
          else
            cmake --build build --config Release --parallel 4
          fi

      - name: Test
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a ctest --test-dir build -C Release --output-on-failure
          else
            ctest --test-dir build -C Release --output-on-failure
          fi

      - name: Collect plugins
        shell: bash
        run: |
          # (not dist/: that is the web build)
          mkdir -p plugin-dist
          for f in VST3 CLAP AU LV2 Standalone; do
            src=$(find build -type d -path "*mkwavez_artefacts/Release/$f" | head -1)
            if [ -n "$src" ]; then cp -R "$src" plugin-dist/; fi
          done
          ls -R plugin-dist | head -50

      - uses: actions/upload-artifact@v4
        with:
          name: mkwavez-${{ matrix.name }}
          path: plugin-dist
